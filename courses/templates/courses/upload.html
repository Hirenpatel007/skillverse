{% extends 'courses/base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-lg border-0" style="border-radius: 16px;">
                <div class="card-header text-white text-center py-4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px 16px 0 0;">
                    <h2 class="mb-0"><i class="fas fa-cloud-upload-alt"></i> Upload Resource</h2>
                    <p class="mb-0 mt-2">Share notes, PDFs, images, videos with the community</p>
                </div>
                <div class="card-body p-5">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="fas fa-heading"></i> Title *</label>
                            <input type="text" name="title" class="form-control form-control-lg" required placeholder="e.g., Python Cheat Sheet">
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="fas fa-align-left"></i> Description</label>
                            <textarea name="description" class="form-control" rows="4" placeholder="Describe your resource..."></textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="fas fa-tag"></i> Category</label>
                            <input type="text" name="category" class="form-control" placeholder="e.g., Python, JavaScript, Web Development">
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="fas fa-file-upload"></i> File *</label>
                            <input type="file" name="file" class="form-control form-control-lg" required accept=".pdf,.jpg,.jpeg,.png,.gif,.mp4,.avi,.mov,.txt,.doc,.docx">
                            <small class="text-muted">Supported: PDF, Images (JPG, PNG, GIF), Videos (MP4, AVI, MOV), Documents (TXT, DOC, DOCX)</small>
                        </div>
                        
                        <div class="mb-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="is_public" id="isPublic" checked>
                                <label class="form-check-label fw-bold" for="isPublic">
                                    <i class="fas fa-globe"></i> Make Public (Share with everyone)
                                </label>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none;">
                                <i class="fas fa-upload"></i> Upload Resource
                            </button>
                            <a href="{% url 'sharing_platform' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left"></i> Back to Sharing Platform
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
